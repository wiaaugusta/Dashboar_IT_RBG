<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>IT Team Management &amp; Operations Platform</title>
  <meta name="description" content="Platform internal Team IT untuk monitoring, project management, KPI, dan operasional." />

  <!-- PWA -->
  <meta name="theme-color" content="#0F172A" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />

  <!-- Design system foundation (order matters: tokens -> layout -> components) -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

  <!--
    Root mount point.
    Router / page modules render into #app.
    Phase 1 hanya menampilkan foundation loading state.
    Login page dan Application Shell akan mengisi #app pada phase berikutnya.
  -->
  <div id="app" class="app-root">
    <div class="boot-screen" id="bootScreen">
      <div class="boot-screen__mark">IT</div>
      <p class="boot-screen__text">Memuat aplikasi...</p>
    </div>
  </div>

  <!-- Global toast container (dipakai oleh ui.js pada phase berikutnya) -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!--
    JS dimuat sebagai ES module supaya setiap file punya scope sendiri
    (tidak saling menimpa variabel global) dan mendukung import/export
    antar modul sesuai prinsip modular di ARCHITECTURE.md.
  -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
